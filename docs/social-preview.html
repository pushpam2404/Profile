<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Social preview</title>
<!-- Source for public/og.png (1200x630). Open this file in a browser at 1200x630 and screenshot it.
     Fonts load from node_modules, so run `npm install` first. -->
<style>
@font-face{font-family:'Bricolage';src:url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');font-weight:200 800}
@font-face{font-family:'Instrument';src:url('../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2');font-weight:400 700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0b0b0e;color:#a1a1aa;font-family:Instrument,system-ui,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:48px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;font:500 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#8a8a94}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ff5b2e;margin-right:14px}
h1{font:650 92px/0.98 Bricolage,sans-serif;letter-spacing:-.035em;color:#f4f4f6;max-width:980px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between}
.name{font:600 34px/1.1 Bricolage,sans-serif;color:#efe7d6}
.sub{margin-top:8px;font-size:24px;color:#a1a1aa}
.url{font:500 20px/1 ui-monospace,Menlo,monospace;color:#8a8a94}
.mega{position:absolute;right:-20px;bottom:-70px;font:700 300px/0.8 Bricolage,sans-serif;letter-spacing:-.05em;color:rgba(239,231,214,.06);pointer-events:none}
</style>
<body>
<div class="mega" aria-hidden="true">PRS</div>
<div class="frame">
  <div class="top"><span><span class="dot"></span>Open to software engineering and data internships</span></div>
  <h1>I like building things.</h1>
  <div class="bottom">
    <div><p class="name">Pushpam Raj Satyarthi</p><p class="sub">CSE at GITAM · Python, TypeScript, SQL</p></div>
    <p class="url">pushpam2404-profile.vercel.app</p>
  </div>
</div>
</body>
</html>
