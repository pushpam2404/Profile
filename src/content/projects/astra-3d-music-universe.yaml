stack: [JavaScript, Three.js, Vite, Node.js, Express, Web Audio, IndexedDB, Vercel]
points:
  - Reads a Spotify connection (top artists, recent plays, Liked Songs) or the full Extended Streaming History export. Parsing and clustering run in the browser, so a 100 MB export never goes through a server.
  - Clusters come from Louvain community detection on a similarity graph of shared genres and countries, collaborations and songs played in the same session. Positions come from a 3D UMAP embedding, then a collision pass keeps planets apart.
  - Genres come from public data (Wikidata, MusicBrainz, and Last.fm if a key is given), because Spotify no longer returns artist genres to apps in development mode. There are no hardcoded genre tables.
  - Lenses filter the map and the side panel together (past favourites, not heard in a while, current rotation, all-time staples, one per year). The selected artist, cluster and lens live in the URL, so Back and Forward work.
  - The planets are Three.js shaders on a plain JavaScript front end with no UI framework, and the server is a small Express app that also runs as a Vercel function.
limits:
  - The screenshots show my own listening history (51,772 plays from 2020 to 2026), loaded from the browser's cache.
  - The map refines as genre lookups arrive, so clusters can shift a little while it loads. Where a lookup finds no usable tags, an artist can land in an odd cluster.
