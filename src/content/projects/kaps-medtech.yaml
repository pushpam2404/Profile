stack: [Node.js, Express, PostgreSQL, JWT, bcrypt, Neon, Vercel]
points:
  - Students and staff book appointments with university doctors. Doctors see a daily queue and record diagnoses, advice and prescriptions.
  - Express 5 API on PostgreSQL (Neon in production) with a static HTML and JavaScript frontend, deployed on Vercel.
  - JWT authentication, bcrypt password hashing, rate limiting and per-user resource checks.
  - Booking inserts and turns a unique-index violation into a 409, so four simultaneous requests for one slot cannot double-book it.
  - An integration suite runs against a real PostgreSQL, and GitHub Actions runs it on every push.
