stack: [React 19, Vite, Tailwind CSS, Node.js, Express, MongoDB, Mongoose, JWT, Vercel]
points:
  - A kitchen posts surplus food with a pickup window and a best-before time, and a nearby NGO claims it. Claims are atomic, so two NGOs can never claim the same listing, and contact details are shared only between the two parties.
  - Full create, read, update and delete for listings, a live board sorted by soonest expiry with countdown timers, and search, city, category and food-type filters that live in the URL so a filtered view can be shared.
  - A JWT-secured REST API on Express with Zod validation, bcrypt password hashing and rate limiting, backed by MongoDB Atlas through Mongoose and deployed to Vercel as a serverless function.
  - A public impact report with weekly and per-category charts, and a personal impact summary for each donor (meals, kilograms and CO2e).
  - Responsive from 360 px phones up, with light and dark themes, labelled forms, keyboard-friendly dialogs, a skip link, visible focus rings and reduced-motion support.
limits:
  - The kitchens, NGOs and listings in the screenshots are demo data.
