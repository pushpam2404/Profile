order: 4
title: MealBridge
tagline: A marketplace that connects kitchens with surplus food to NGOs nearby, so cooked food is collected before it spoils.
context: Web Application Framework course project
role: Author
status: live
color: green
shots:
  - file: 01-home.jpg
    alt: "MealBridge home page with the live pickup board."
  - file: 02-browse.jpg
