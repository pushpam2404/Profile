<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Greenbar mark">
  <!-- Ground: --color-paper -->
  <rect width="32" height="32" fill="#EDEFEA" />
  <!-- Three continuous-feed bands: --color-bar -->
  <rect x="0" y="1" width="32" height="8" fill="#E2E8DD" />
  <rect x="0" y="12" width="32" height="8" fill="#E2E8DD" />
  <rect x="0" y="23" width="32" height="8" fill="#E2E8DD" />
  <!-- One verified rule: --color-verified. The site's mark, not a status indicator. -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#0F6E63" stroke-width="1.5" />
</svg>
